name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.4.1'

jobs:
  quality:
    name: Quality (Node 24 / pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # build first: it generates the typed-route definitions that `tsc` needs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  pm-matrix:
    name: Install + Build (Node ${{ matrix.node-version }} / ${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        pm: [bun, pnpm, npm, yarn]
    steps:
      - uses: actions/checkout@v5
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # no lockfile for npm/yarn in this repo (single pnpm lock) → no cache there
          cache: ${{ matrix.pm == 'pnpm' && 'pnpm' || '' }}
          yarn-version: '1.22.22'
      - name: install
        run: |
          case "${{ matrix.pm }}" in
            bun)  bun install ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm)  npm install --no-audit --no-fund ;;
            yarn) yarn install ;;
          esac
      - name: build
        run: |
          case "${{ matrix.pm }}" in
            bun)  bun run build ;;
            pnpm) pnpm run build ;;
            npm)  npm run build ;;
            yarn) yarn build ;;
          esac

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json pnpm test:e2e --reporter=line --reporter=json > e2e-console.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -60 e2e-console.log
            msg=$(node -e "const r=require('./results.json');const out=[];for(const su of r.suites||[])for(const s2 of su.suites||[])for(const sp of s2.specs||[])for(const t of sp.tests||[])for(const res of t.results||[])if(res.status!=='passed')out.push(sp.title+' :: '+((res.error&&res.error.message)||res.status));console.log(out.slice(0,4).join(' ||| ').split(String.fromCharCode(10)).join(' / ').slice(0,1400))" 2>/dev/null)
            if [ -z "$msg" ]; then
              msg=$(grep -m4 -F 'Error:' e2e-console.log | head -c 900)
            fi
            msg=$(printf '%s' "$msg" | tr '%' '#' | tr -d '\r')
            echo "::error title=Playwright failures::$msg"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
